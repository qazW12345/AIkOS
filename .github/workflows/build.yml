name: build-and-test

on: [push]

# Three actors (AIko + 2 worker profiles) push to different branches; a new push
# to the same branch supersedes its own stale run (ADR-018 multi-agent flow).
# Different branches still run in parallel — GitHub free tier queues beyond
# 2 concurrent jobs, which is fine (runs wait, they don't collide).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read-only at workflow level (checkov CKV2_GHA_1); the lint
# job scopes statuses: write itself (zizmor excessive-permissions).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full SHAs (zizmor unpinned-uses; supply-chain):
      #   actions/checkout@11d5960a… = v4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0        # paths-filter diffs against the default-branch merge-base
          persist-credentials: false   # zizmor artipacked: don't leave the token in .git/config

      # Skip the QEMU suite when no code changed (docs-only pushes) — the
      # suite grows with every phase; don't burn it on prose (ADR-011 intent).
      - name: Paths Changes Filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          filters: |
            code:
              - 'src/**'
              - 'user/**'
              - 'test.sh'
              - 'build.sh'
              - '.github/**'

      - name: Install toolchain
        if: steps.changes.outputs.code == 'true'
        run: sudo apt-get update && sudo apt-get install -y nasm clang lld llvm qemu-system-x86

      - name: Build and boot-test
        if: steps.changes.outputs.code == 'true'
        run: ./test.sh

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write          # job-scoped: only super-linter's status reporter needs it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false   # zizmor artipacked

      # shellcheck (build/test scripts) + markdownlint (docs are code) +
      # yamllint (workflows). Disabled on purpose: clang-format/cpplint would
      # churn the hand-tuned freestanding kernel style; jscpd flags test.sh's
      # intentionally-similar QEMU blocks; prettier/biome/JSON formatter taste
      # fights aren't worth it on config files; the python linters fire on the
      # one throwaway debug helper (tools/ppm2png.py) — revisit when real
      # python tooling lands. markdownlint uses the house config at
      # .github/linters/.markdown-lint.yml (default discovery).
      - name: Super-Linter
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918  # v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODE_BASES: false
          VALIDATE_CLANG_FORMAT: false
          VALIDATE_CPP: false
          VALIDATE_JSCPD: false
          VALIDATE_PRETTIER: false
          VALIDATE_JSON: false
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_NATURAL_LANGUAGE: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_PYLINT: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_PYTHON_RUFF: false
          VALIDATE_PYTHON_RUFF_FORMAT: false
          VALIDATE_SHELL_SHFMT: false
          VALIDATE_YAML_PRETTIER: false
