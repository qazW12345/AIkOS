name: build-and-test

on: [push]

# Three actors (AIko + 2 worker profiles) push to different branches; a new push
# to the same branch supersedes its own stale run (ADR-018 multi-agent flow).
# Different branches still run in parallel — GitHub free tier queues beyond
# 2 concurrent jobs, which is fine (runs wait, they don't collide).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read-only at workflow level (checkov CKV2_GHA_1); the lint
# job scopes pull-requests: write itself for gitleaks' PR annotations (zizmor).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full SHAs (zizmor unpinned-uses; supply-chain):
      #   actions/checkout@11d5960a… = v4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0        # paths-filter diffs against the default-branch merge-base
          persist-credentials: false   # zizmor artipacked: don't leave the token in .git/config

      # Skip the QEMU suite when no code changed (docs-only pushes) — the
      # suite grows with every phase; don't burn it on prose (ADR-011 intent).
      - name: Paths Changes Filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: changes
        with:
          filters: |
            code:
              - 'src/**'
              - 'user/**'
              - 'test.sh'
              - 'build.sh'
              - '.github/**'

      - name: Install toolchain
        if: steps.changes.outputs.code == 'true'
        run: sudo apt-get update && sudo apt-get install -y nasm clang lld llvm qemu-system-x86

      - name: Build and boot-test
        if: steps.changes.outputs.code == 'true'
        run: ./test.sh

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write    # job-scoped: gitleaks' PR leak annotations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false   # zizmor artipacked

      # Secrets scan ONLY (2026-08-06, PR #21): the style linters
      # (shellcheck/markdownlint/yamllint/codespell) moved LOCAL to
      # tools/lint-local.sh plus the reviewer agent — the GitHub lint job now
      # exists solely because gitleaks is the one deterministic check that
      # cannot be delegated (public repo; a leaked PAT with workflow scope
      # would let anyone push). Runs in ~30s, no giant container.
      - name: Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
