name: build-and-test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm clang lld llvm qemu-system-x86

      - name: Build and boot-test
        run: ./test.sh
